<!DOCTYPE html>
<html>

<head>

<title>Summary | KCP-QA</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<style>

.container {

width: 70%;

margin: 40px auto;

background: white;

padding: 30px;

border-radius: 12px;

box-shadow: 0px 5px 15px rgba(0,0,0,0.1);

}

.summary-box {

white-space: pre-line;

margin-top: 20px;

}

.keyword {

display: inline-block;

background: #e3ecff;

color: #2a5db0;

padding: 6px 12px;

margin: 5px;

border-radius: 6px;

font-size: 14px;

}

</style>

</head>

<body>


<div class="navbar">

<div class="logo">

📘 KCP-QA

</div>

<div class="menu">

<a href="/dashboard">Dashboard</a>

<a href="/upload_page">Upload PDF</a>

<a href="/qa_page">Ask Question</a>

</div>

</div>


<div class="container">

<h2>Document Summary</h2>


<div class="summary-box">

{{ summary }}

</div>


<br>

<h3>Keywords</h3>


{% for word in keywords %}

<span class="keyword">

{{ word }}

</span>

{% endfor %}


<br><br>

<a href="/dashboard">

← Back to Dashboard

</a>

</div>


</body>
</html>
